<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">
  <style>
    .bg { fill: #0d1117; rx: 12px; }
    .text-style {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
    }
  </style>

  <!-- 背景 -->
  <rect width="100%" height="100%" class="bg" />

  <!-- 衝撃波エフェクト（SMILで無限ループ） -->
  <circle cx="300" cy="90" r="0" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0">
    <animate attributeName="r" values="0; 0; 130; 130" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="8; 8; 1; 1" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- 爆発粒子グループ -->
  <g transform="translate(300, 90)">
    <!-- 粒子1 -->
    <circle cx="0" cy="0" r="6" fill="#ff2a5f">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; -120,-60; -120,-60" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- 粒子2 -->
    <circle cx="0" cy="0" r="8" fill="#00f0ff">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 110,-70; 110,-70" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- 粒子3 -->
    <circle cx="0" cy="0" r="5" fill="#ffe600">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; -140,30; -140,30" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- 粒子4 -->
    <circle cx="0" cy="0" r="7" fill="#00ff66">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 130,50; 130,50" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- 粒子5 -->
    <circle cx="0" cy="0" r="9" fill="#ff7700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; -50,-80; -50,-80" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- 粒子6 -->
    <circle cx="0" cy="0" r="6" fill="#b026ff">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 60,80; 60,80" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; 0.1; 0.35; 1" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 中央のユーザー名（拡大・縮小と不透明度制御） -->
  <g transform="translate(300, 90)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.3; 1.1; 1; 0.8; 0.3" keyTimes="0; 0.22; 0.26; 0.9; 1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.22; 0.8; 0.9; 1" dur="3s" repeatCount="indefinite" />
      <text x="0" y="0" dominant-baseline="central" text-anchor="middle" class="text-style">
        fatcorn753
      </text>
    </g>
  </g>
</svg>
